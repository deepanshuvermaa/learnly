appId: com.listenly.app
productName: Listenly
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  category: public.app-category.productivity
  # Screen-share exclusion (NSWindowSharingNone) requires no special entitlement,
  # but system-audio capture on macOS needs the microphone entitlement below.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
